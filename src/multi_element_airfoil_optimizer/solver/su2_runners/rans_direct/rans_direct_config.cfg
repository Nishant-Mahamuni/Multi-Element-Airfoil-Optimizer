% =========================================================
% SU2 Configuration — Multi-Element Airfoil Optimizer
% =========================================================

% ---- Problem definition ----
SOLVER= RANS
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ---- Freestream conditions ----
MACH_NUMBER= 0.15
AOA= 5.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15

% ---- Viscous / turbulence ----
KIND_TURB_MODEL= SA
FREESTREAM_TURBULENCEINTENSITY= 0.01

% ---- Reference values ----
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 1.0

% ---- Numerical method ----
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 10.0
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1e-10
LINEAR_SOLVER_ITER= 5

% ---- Convective scheme ----
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05

% ---- Convergence ----
ITER= 5000
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1e-6

% ---- Boundary conditions ----
MARKER_EULER= ( airfoils )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoils )
MARKER_MONITORING= ( airfoils )

% ---- Mesh ----
MESH_FILENAME= src/multi_element_airfoil_optimizer/meshing/outputs/mesh.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out.su2

% ---- Output ----
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_CSV)
CONV_FILENAME= history
RESTART_FILENAME= restart_flow.dat
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_WRT_FREQ= 250