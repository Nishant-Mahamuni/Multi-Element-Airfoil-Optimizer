[project]
name = "multi-element-airfoil-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gmsh>=4.15.2",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "ruff>=0.15.20",
    "scipy>=1.18.0",
]

[project.scripts]
multi-element-airfoil-optimizer = "multi_element_airfoil_optimizer:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["F403"]